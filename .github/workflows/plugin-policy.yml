name: Vendor plugin boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/plugin-policy.test.js tests/codex-plugin.test.js tests/config.test.js tests/descriptors.test.js tests/web.test.js tests/workspace.test.js tests/workspace-hidden-files.test.js tests/dns-policy.test.js
      - run: npm run audit:package
